# 码搭 CodePilot · 配置文件
# 此文件为可选，不存在时使用内置默认值。
# 只写需要覆盖的项即可，未写的项保持默认。

# Agent 循环配置
agent:
  max_iterations: 10
  max_context_tokens: 8000
  # M2 状态机在执行前强制各阶段预算；总迭代数仍是硬上限。
  phase_budgets:
    discovery_budget: 3
    inspect_budget: 8
    edit_budget: 3
    verify_budget: 4
    recovery_budget: 2

# 模型参数
model:
  temperature: 0.3
  max_tokens: 4096

# 工具参数
tools:
  shell_timeout: 30
  output_max_chars: 4000
  diff_max_chars: 3000
  fetch_max_chars: 4000
  # 事务式编辑拒绝超大文件，避免一次工具调用占用过多内存或生成巨型 diff。
  edit_max_bytes: 2000000

# RAG 参数
rag:
  model_name: "all-MiniLM-L6-v2"
  # 向量模型与 Cross-Encoder 统一缓存到项目目录，避免写入系统盘。
  cache_folder: ".codepilot/model-cache"
  # 查询和增量索引均不隐式访问模型仓库；请在安装阶段准备模型缓存。
  local_files_only: true
  chunk_lines: 30
  # 默认搜索源码与配置；设为 true 时同时搜索 Markdown/TXT 文档。
  include_docs: false
  candidate_multiplier: 3
  bm25_k1: 1.5
  bm25_b: 0.75
  # 兼容性固定 RRF。独立验证中自适应方案只有小幅点估计提升，默认不切换。
  rrf_k: 10
  vector_weight: 0.25
  bm25_weight: 2.0
  adaptive_routing:
    # 显式启用后，hybrid/rerank 候选阶段消费 QueryFeatures、置信信号和冻结 Router。
    enabled: false
    # 路由计算异常时复用同一批 Vector/BM25 排名回退固定 RRF，不重复请求模型。
    fallback_on_error: true
  reranker:
    enabled: false
    # CPU 友好的多语言模型；有 GPU 时可切换为 BAAI/bge-reranker-v2-m3。
    model_name: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
    candidate_count: 30
    batch_size: 16
    # 单模型Worker的等待队列容量；生产者满载时不阻塞并由Retriever回退RRF。
    queue_capacity: 8
    # 从请求被队列接受起计算的调用方deadline；到期后回退，运行中的PyTorch调用不会被强杀。
    inference_timeout_seconds: 30.0
    # 连续真实加载/推理失败达到阈值后熔断；queue full和调用方timeout不计数。
    failure_threshold: 3
    # 熔断冷却结束后只放行一个恢复探测请求。
    circuit_cooldown_seconds: 60.0
    # 服务启动时仅向单模型Worker投递预热任务；启动线程不等待模型加载。
    background_warmup: true
    max_length: 512
    device: null
    cache_folder: ".codepilot/model-cache"
    # 线上查询不隐式下载模型；首次使用前显式预下载，失败则回退 RRF。
    local_files_only: true
    fallback_on_error: true

# 服务化参数
server:
  max_concurrent: 5
  host: "0.0.0.0"
  port: 8000

# MCP 参数
# allow_dangerous: 是否允许通过 MCP 通道调用危险工具（run_shell/git_add/git_commit）。
# 默认 false —— MCP 是无交互通道，无法人工确认。
mcp:
  allow_dangerous: false
  connect_timeout: 10
